services:
  db:
    image: postgres:16-alpine
    container_name: remates-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-remates_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remates_password}
      POSTGRES_DB: ${POSTGRES_DB:-remates}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
